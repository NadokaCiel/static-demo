# 复制为 jenkins.properties 并提交到仓库（Pipeline script from SCM 检出后读取）
# 与 Dockerfile 中 Node 版本保持一致：构建时通过 --build-arg 传入

# Node 主版本（须与 Dockerfile 中 ARG 默认值一致，或与 .nvmrc 对齐）
NODE_VERSION=22.19.0

# 部署与 Docker
HTML_ROOT=/usr/share/nginx/html
PROJECT_SLUG=static-demo
SEGMENT_DEV=dev
SEGMENT_STAGING=staging
SEGMENT_PROD=prod
NGINX_CONTAINER=nginx

# docker build 临时镜像名前缀（避免多 Job 冲突）
DOCKER_IMAGE_PREFIX=static-demo-ci

# 仅允许触发的分支（push 到这些分支等价于 PR 合并后的 push）
ALLOWED_BRANCHES=develop,stg,main
